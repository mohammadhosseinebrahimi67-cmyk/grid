<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: gray;
        }
        .wrapper{
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(4,3);
            grid-template-rows: repeat(3,1fr);
            gap: 20px;
            >figure{
                border: 2px solid blue;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
                font-size: 50px;
                position: relative;
                >img{
                    position: absolute;
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                }
                &:nth-of-type(1){
                    /* grid-column-start: 1; */
                    /* grid-column-end: 4; */
                    grid-column: 1 / span 3;
                    /* grid-row-start: 1; */
                    /* grid-row-end: 3; */
                    grid-row: 1 / span 2;
                }
                &:nth-of-type(2){
                    grid-column: 4 / span 1;
                    grid-row: 1 / span 1;
                }
                &:nth-of-type(3){
                    grid-column: 1 / span 3;
                }
                &:nth-of-type(4){
                    grid-row: 2 / span 3;
                }
                
            }
        }
    </style>
</head>

<body>
    <section class="wrapper">
        <figure>
            <img src="images/car.webp" alt="">
        </figure>
        <figure>
            <img src="images/car.webp" alt="">
        </figure>
        <figure>
            <img src="images/car.webp" alt="">
        </figure>
        <figure>
            <img src="images/car.webp" alt="">
        </figure>
    </section>

</body>

</html>
