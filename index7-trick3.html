<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: gray;
        }
        .wrapper{
            width: 100%;
            height: 100vh;
            padding: 50px;
            /* border: 2px solid red; */
            display: grid;
            grid-template-columns: repeat(5,1fr);
            grid-template-rows: repeat(4,1fr);
            gap: 25px;
            >div{
                border: 2px solid rgb(1, 48, 18);
                font-size: 50px;
                border-radius: 15px;
                display: flex;
                justify-content: center;
                align-items: center;
                &:nth-of-type(1){
                    grid-row: 1 / span 2;
                }
                &:nth-of-type(2){
                    grid-row: 3 / span 2;
                }
                &:nth-of-type(3){
                    grid-column: 2 /  span 3;
                }
                &:nth-of-type(4){
                    grid-column: 2 / span 3;
                    grid-row: 2 / span 2;
                }
                &:nth-of-type(5){
                    grid-column: 2 / span 4;
                    grid-row: 4 / span 1;
                }
                &:nth-of-type(6){
                    grid-column: 5 / span 1;
                    grid-row: 1 / span 3;
                }

                
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
    </div>
    

</body>

</html>
