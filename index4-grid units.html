<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *,
        *::before,
        *::after {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: gray;
        }
        .wrapper{
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns:100px 10% min-content max-content auto;
            grid-template-rows: repeat(3,1fr);
            div{
                border: 2px solid red;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div>hello world</div>
        <div>hello world</div>
        <div>hello world</div>
        <div>hello world</div>
        <div>hello world</div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>

</body>

</html>
